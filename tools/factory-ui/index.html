<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Software Factory</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff6209' d='M2 21V10.5l5.5 3.2v-3.2l5.5 3.2v-3.2l5 2.9V3h4v18z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail" aria-label="Teams and threads"></aside>
    <main class="main" id="main" tabindex="-1">
      <div class="boot">
        <div class="boot-mark" aria-hidden="true"></div>
        <p>Loading the board…</p>
        <noscript><p>The factory board needs JavaScript.</p></noscript>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
